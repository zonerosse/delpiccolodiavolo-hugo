baseURL = "https://delpiccolodiavolo.it/"
title = "Del Piccolo Diavolo"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false

# Abilita lastmod automatico da Git
enableGitInfo = true

# Disabilita generazione automatica di alcune pagine
disableKinds = ["taxonomy", "term", "RSS"]

# Abilita sitemap
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[languages]
  [languages.it]
    languageCode = "it"
    languageName = "Italiano"
    weight = 1
    contentDir = "content/it"
    [languages.it.params]
      description = "Allevamento etico di Staffordshire Bull Terrier. Cuccioli sani, equilibrati e con pedigree."
  
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    [languages.en.params]
      description = "Ethical Staffordshire Bull Terrier breeding. Healthy, balanced puppies with pedigree."
  
  [languages.de]
    languageCode = "de"
    languageName = "Deutsch"
    weight = 3
    contentDir = "content/de"
    [languages.de.params]
      description = "Ethische Staffordshire Bull Terrier Zucht. Gesunde, ausgeglichene Welpen mit Stammbaum."

[params]
  # Incollare qui l'URL /exec del deployment Apps Script (vedi apps-script-lista-attesa.gs)
  listaAttesaEndpoint = "https://script.google.com/macros/s/AKfycbxW-K7ZI0f6v-DnJ5xF9DxHYE350z0LjIWO-etSWbqmHMkdhwJDVZxPCXZbfADxKoGJNg/exec"
  phone = "+393924635584"
  email = "zonerosse@gmail.com"
  whatsapp = "393924635584"
  address = "Via Amerigo Chierici, 12, 44020 Ostellato (FE)"
  facebook = "https://www.facebook.com/delpiccolodiavolo"
  youtube = "https://www.youtube.com/@Staffordshiredelpiccolodiavolo"
  foundingYear = "2013"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Formato aggiuntivo: versione Markdown delle pagine, per gli agenti AI
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    baseName = "index"

[outputs]
  home = ["HTML", "sitemap", "MARKDOWN"]
  page = ["HTML", "MARKDOWN"]

