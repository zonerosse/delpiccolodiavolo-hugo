baseURL = "https://delpiccolodiavolo.it/"
title = "Del Piccolo Diavolo"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false

# Abilita lastmod automatico da Git
enableGitInfo = true

# Disabilita generazione automatica di alcune pagine
disableKinds = ["taxonomy", "term", "RSS"]

# Abilita sitemap
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[languages]
  [languages.it]
    languageCode = "it"
    languageName = "Italiano"
    weight = 1
    contentDir = "content/it"
    [languages.it.params]
      description = "Allevamento etico di Staffordshire Bull Terrier. Cuccioli sani, equilibrati e con pedigree."
  
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    [languages.en.params]
      description = "Ethical Staffordshire Bull Terrier breeding. Healthy, balanced puppies with pedigree."
  
  [languages.de]
    languageCode = "de"
    languageName = "Deutsch"
    weight = 3
    contentDir = "content/de"
    [languages.de.params]
      description = "Ethische Staffordshire Bull Terrier Zucht. Gesunde, ausgeglichene Welpen mit Stammbaum."

[params]
  # Incollare qui l'URL /exec del deployment Apps Script (vedi apps-script-lista-attesa.gs)
  listaAttesaEndpoint = "https://script.google.com/macros/s/AKfycbxW-K7ZI0f6v-DnJ5xF9DxHYE350z0LjIWO-etSWbqmHMkdhwJDVZxPCXZbfADxKoGJNg/exec"
  phone = "+393924635584"
  email = "zonerosse@gmail.com"
  whatsapp = "393924635584"
  address = "Via Amerigo Chierici, 12, 44020 Ostellato (FE)"
  facebook = "https://www.facebook.com/delpiccolodiavolo"
  youtube = "https://www.youtube.com/@Staffordshiredelpiccolodiavolo"
  foundingYear = "2013"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "sitemap"]
  page = ["HTML"]

# ---------------------------------------------------------------
# FOTO HERO A ROTAZIONE
# La foto della home cambia da sola in base al periodo.
# rotazione = "settimane" (predefinito) | "giorni" | "mesi"
# Per aggiungere una foto: copia un blocco [[params.hero.foto]]
# ---------------------------------------------------------------
[params.hero]
  rotazione = "settimane"

  [[params.hero.foto]]
    file = "/images/bilquis-campionessa-hero.avif"
    w = 800
    h = 976
    alt = "JCH CH Bilquis Goddess Diabhal, Campionessa Italiana Staffordshire Bull Terrier, in posa sul ring di esposizione"
    title = "Bilquis Goddess Diabhal — Campionessa Italiana"
    didascalia = "Bilquis Goddess Diabhal — Campionessa Italiana ENCI, 4ª al World Dog Show 2024"

  [[params.hero.foto]]
    file = "/images/lothar-matthaus-esposizione.avif"
    w = 620
    h = 983
    alt = "JCH Lothar Matthäus del Piccolo Diavolo, Staffordshire Bull Terrier tigrato in posa da esposizione"
    title = "Lothar Matthäus del Piccolo Diavolo — Giovane Campione Italiano"
    didascalia = "Lothar Matthäus — Giovane Campione Italiano, figlio di Bullbrothers Hott as Hell"

  [[params.hero.foto]]
    file = "/images/divine-cucciola-tre-mesi.avif"
    w = 800
    h = 1089
    alt = "Divine del Piccolo Diavolo, cucciola di Staffordshire Bull Terrier nera di tre mesi in posa"
    title = "Divine del Piccolo Diavolo a tre mesi"
    didascalia = "Divine del Piccolo Diavolo — cucciola nera a tre mesi, allevata in famiglia"
