baseURL = "https://delpiccolodiavolo.it/"
title = "Del Piccolo Diavolo"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false

# Abilita lastmod automatico da Git
enableGitInfo = true

# Disabilita generazione automatica di alcune pagine
disableKinds = ["taxonomy", "term", "RSS"]

# Abilita sitemap
enableRobotsTXT = true

# Da dove Hugo prende le date.
# Senza questa sezione, con enableGitInfo attivo, un articolo privo di "date"
# nel front matter eredita la data dell'ultimo commit: basta correggere una
# virgola e l'articolo risulta pubblicato oggi, finendo in "Ultimi articoli".
# Qui la data di pubblicazione viene SOLO dal front matter, mentre la data di
# modifica continua ad aggiornarsi da sola con i commit.
[frontmatter]
  date = ["date", "publishDate"]
  publishDate = ["publishDate", "date"]
  # Prima il lastmod del front matter (aggiornato dal gancio pre-commit),
  # poi git. Con ":git" in testa Cloudflare, che scarica il repository senza
  # la storia completa, dava a tutte le pagine la data dell'ultimo commit:
  # nella sitemap il sito risultava cambiato per intero a ogni push.
  lastmod = ["lastmod", ":git", "date"]
  expiryDate = ["expiryDate"]

# Nessuna tassonomia. Hugo ne crea due per impostazione predefinita, tag e
# categorie, e prova a generare le pagine elenco /tags/ e /categories/ anche
# quando nessuna pagina le usa: da li' l'avviso "no layout file for kind
# taxonomy". Le categorie del blog sono sezioni HTML dentro blog.md, non
# tassonomie, quindi qui non servono.
[taxonomies]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[languages]
  [languages.it]
    languageCode = "it"
    languageName = "Italiano"
    weight = 1
    contentDir = "content/it"
    [languages.it.params]
      description = "Allevamento etico di Staffordshire Bull Terrier. Cuccioli sani, equilibrati e con pedigree."
  
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    [languages.en.params]
      description = "Ethical Staffordshire Bull Terrier breeding. Healthy, balanced puppies with pedigree."
  
  [languages.de]
    languageCode = "de"
    languageName = "Deutsch"
    weight = 3
    contentDir = "content/de"
    [languages.de.params]
      description = "Ethische Staffordshire Bull Terrier Zucht. Gesunde, ausgeglichene Welpen mit Stammbaum."

[params]
  # Riquadro "Ultima cucciolata" nelle pagine cuccioli e cucciolate, nelle tre
  # lingue. false = non compare. Rimettere true quando c’è una cucciolata da
  # mostrare: il riquadro pesca da solo l’ultima voce del diario.
  mostraUltimaCucciolata = false
  # Incollare qui l'URL /exec del deployment Apps Script (vedi apps-script-prenotazioni.gs)
  listaAttesaEndpoint = "https://script.google.com/macros/s/AKfycbxW-K7ZI0f6v-DnJ5xF9DxHYE350z0LjIWO-etSWbqmHMkdhwJDVZxPCXZbfADxKoGJNg/exec"
  phone = "+393924635584"
  email = "zonerosse@gmail.com"
  whatsapp = "393924635584"
  address = "Via Amerigo Chierici, 12, 44020 Ostellato (FE)"
  facebook = "https://www.facebook.com/delpiccolodiavolo"
  youtube = "https://www.youtube.com/@Staffordshiredelpiccolodiavolo"
  instagram = "https://www.instagram.com/delpiccolodiavolostaffy/"
  foundingYear = "2013"
  # Recensioni Google: aggiornare SOLO QUI. Ogni numero di recensioni del sito
  # legge da questi due valori, compreso il titolo della pagina recensioni:
  # nei testi si scrive <!--REC-TOTALE--> al posto del numero e <!--REC-VOTO-->
  # al posto del voto, e Hugo li sostituisce da solo.
  recensioniVoto = "5.0"
  recensioniTotale = "41"

# Cloudflare Pages mette nell'ambiente di build lo SHA del commit che sta
# compilando (CF_PAGES_COMMIT_SHA). Hugo di norma legge solo le variabili
# HUGO_* e CI: qui gli si permette di leggere anche questa, che finisce
# nell'intestazione X-Build della sitemap (layouts/index.headers). Serve al
# workflow IndexNow per sapere quando il commit e' davvero online.
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^CF_PAGES_COMMIT_SHA$']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Formato aggiuntivo: versione Markdown delle pagine, per gli agenti AI
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]
  [mediaTypes."text/headers"]
    suffixes = [""]

[outputFormats]
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    baseName = "index"

  [outputFormats.HEADERS]
    mediaType = "text/headers"
    baseName = "_headers"
    isPlainText = true
    isHTML = false
    notAlternative = true

  # llms.txt generato da assets/llms/<lingua>.txt (layouts/index.llmstxt.txt)
  [outputFormats.LLMSTXT]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    isHTML = false
    notAlternative = true

  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    isHTML = false
    rel = "alternate"

[outputs]
  home = ["HTML", "sitemap", "MARKDOWN", "LLMSTXT", "LLMSFULL", "HEADERS"]
  page = ["HTML", "MARKDOWN"]

# Feed RSS del programma di allevamento: una voce per ogni scheda cucciolata
# della pagina (programma-allevamento/feed.xml, e le versioni EN e DE).
# Le schede portano id e data-nascita, da cui il feed prende link e data.
[outputFormats.RSSPROGRAMMA]
  mediaType = "application/rss+xml"
  baseName = "feed"
  isPlainText = false
  rel = "alternate"

[[cascade]]
  outputs = ["HTML", "MARKDOWN", "RSSPROGRAMMA"]
  [cascade.target]
    kind = "page"
    path = "{/programma-allevamento,/litters-staffordshire-bull-terrier,/wuerfe-staffordshire-bull-terrier}"

