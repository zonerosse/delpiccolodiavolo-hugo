name: Segnala le pagine a IndexNow

# Avvisa Bing (e quindi ChatGPT in modalita' navigazione, Copilot e Yandex)
# che il sito e' cambiato, invece di aspettare che passino a controllare.
#
# COME FUNZIONA
# -------------
# Dopo ogni push su main aspetta che Cloudflare abbia pubblicato il commit
# (vedi "Aspetta che Cloudflare pubblichi" qui sotto), poi legge le sitemap delle tre lingue (/sitemap.xml, /en/sitemap.xml,
# /de/sitemap.xml) e manda a IndexNow SOLO le pagine con lastmod di oggi o di
# ieri, cioe' quelle toccate dal commit. Segnalare ogni volta tutto il sito
# insegna ai motori che le segnalazioni non significano niente.
#
# Lanciato a mano (GitHub -> Actions -> questo workflow -> "Run workflow")
# manda invece tutte le pagine delle tre lingue: serve per un ricontrollo
# completo, per esempio dopo un cambio di struttura.
#
# La chiave e' in static/6ddc5a9e8d861ef5b8263d15a72183d9.txt e viene
# pubblicata insieme al sito: IndexNow la legge da li'.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'hugo.toml'
  workflow_dispatch:

jobs:
  segnala:
    runs-on: ubuntu-latest
    env:
      HOST: delpiccolodiavolo.it
    steps:
      # Prima c'era un'attesa fissa di 3 minuti: se Cloudflare ci metteva di
      # piu', la sitemap letta era quella vecchia, nessuna pagina risultava
      # cambiata e il run finiva "riuscito" senza aver segnalato niente.
      # Ora il workflow chiede ogni 30 secondi l'intestazione X-Build della
      # sitemap, che Hugo scrive con il commit compilato da Cloudflare
      # (layouts/index.headers), e prosegue appena il sito e' cambiato:
      # X-Build uguale a questo commit, oppure diverso da quello trovato
      # all'inizio (succede se nel frattempo e' arrivato un push piu' nuovo).
      # Dopo 20 minuti prosegue comunque e lascia un avviso giallo nel run.
      - name: Aspetta che Cloudflare pubblichi
        run: |
          build() {
            curl -sSI --retry 2 "https://$HOST/sitemap.xml" 2>/dev/null \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-build"{print $2}'
          }
          INIZIO=$(build)
          echo "Online all'avvio: ${INIZIO:-(nessun X-Build)}   Commit di questo push: $GITHUB_SHA"
          for i in $(seq 1 40); do
            ORA=$(build)
            if [ -n "$ORA" ] && { [ "$ORA" = "$GITHUB_SHA" ] || [ "$ORA" != "$INIZIO" ]; }; then
              echo "Pubblicato ($ORA) dopo circa $(( (i-1)*30 )) secondi."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Dopo 20 minuti il sito non risulta aggiornato a questo commit. Segnalo comunque le pagine con la sitemap attuale."

      - name: Leggi le sitemap e manda le URL
        env:
          KEY: 6ddc5a9e8d861ef5b8263d15a72183d9
          TUTTO: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          for L in "" "en/" "de/"; do
            curl -sS --retry 3 --retry-delay 10 "https://$HOST/${L}sitemap.xml" -o "sitemap-${L%/}.xml" || true
          done

          python3 - <<'PY' > payload.json
          import glob, json, os, re, sys, datetime
          oggi = datetime.date.today()
          soglia = (oggi - datetime.timedelta(days=1)).isoformat()
          tutto = os.environ.get("TUTTO") == "true"
          urls = []
          for f in sorted(glob.glob("sitemap-*.xml")):
              xml = open(f, encoding="utf-8").read()
              for blocco in re.findall(r"<url>(.*?)</url>", xml, re.S):
                  loc = re.search(r"<loc>(.*?)</loc>", blocco)
                  mod = re.search(r"<lastmod>(.*?)</lastmod>", blocco)
                  if not loc:
                      continue
                  if tutto or (mod and mod.group(1)[:10] >= soglia):
                      urls.append(loc.group(1).strip())
          urls = sorted(set(urls))[:10000]
          print(f"URL da segnalare: {len(urls)}", file=sys.stderr)
          for u in urls:
              print("  " + u, file=sys.stderr)
          print(json.dumps({
            "host": os.environ["HOST"],
            "key": os.environ["KEY"],
            "keyLocation": f"https://{os.environ['HOST']}/{os.environ['KEY']}.txt",
            "urlList": urls
          }))
          PY

          N=$(python3 -c "import json;print(len(json.load(open('payload.json'))['urlList']))")
          if [ "$N" -eq 0 ]; then echo "Nessuna pagina cambiata, niente da segnalare."; exit 0; fi

          echo "Invio a IndexNow..."
          CODE=$(curl -sS -o risposta.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json)
          echo "Risposta: $CODE"
          cat risposta.txt || true

          # 200 e 202 sono entrambi esiti buoni.
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then exit 1; fi
